services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: recommender
      POSTGRES_PASSWORD: recommender
      POSTGRES_DB: recommender
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommender"]
      interval: 3s
      retries: 20
  app:
    build: .
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+psycopg://recommender:recommender@db:5432/recommender
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      # Optional: enables LLM intent parsing. Kept server-side; never sent to the browser.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # Mount the supplied PDFs to enable "open PDF page" links on evidence (optional):
    # volumes: ["./dataset:/app/dataset:ro"]
volumes:
  pgdata:
