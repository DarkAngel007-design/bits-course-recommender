[project]
name = "bits-course-recommender"
version = "1.0.0"
description = "Evidence-backed BITS academic course recommender: offline PDF ingestion, deterministic academic engine, constrained LLM intent parsing."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
ingest = [
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
]
llm = [
    "anthropic>=0.40",
]
postgres = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["backend*", "ingestion*"]
