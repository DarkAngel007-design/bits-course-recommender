# Reviewed academic rules.
#
# Each rule is a typed record the academic engine interprets (it never executes text).
# `source.excerpt` must appear verbatim (after whitespace/quote normalisation) in the named
# document family; ingestion locates the page, attaches evidence and REJECTS the rule into
# the review queue if the excerpt cannot be found. Parameters are transcribed from the
# excerpt, never inferred.
version: "rules-2026.09.1"
reviewed_by: "maintainer (initial review, 2026-09-28)"
rules:
  - id: max_units_per_semester
    type: plan_limit
    applies_to: first_degree
    params: {max_units: 25, credit_system: units, excludes: "deficiency/audit courses"}
    description: A first degree student can register for at most 25 units in a semester.
    source: {family: regulations, excerpt: "The maximum number of units, a first degree student can register is twenty-five"}

  - id: course_cleared_by_grade
    type: attempt_semantics
    applies_to: all
    params: {clearing_grades: ["A", "A-", "B", "B-", "C", "C-", "D", "E", "GOOD", "CLR", "SATISFACTORY", "EXCELLENT", "FAIR"],
             non_clearing_reports: ["I", "GA", "W", "RC", "RRA", "DP", "NC", "POOR", "UNSATISFACTORY"]}
    description: A course is cleared when the student obtains a grade; reports (NC, W, RC, I, GA ...) do not clear it.
    source: {family: regulations, excerpt: "A course is deemed to have been cleared if the student obtains a grade in the course."}

  - id: latest_performance_governs
    type: attempt_semantics
    applies_to: all
    params: {policy: latest_attempt}
    description: For a course taken more than once, the latest performance determines whether it is cleared.
    source: {family: regulations, excerpt: "the status of clearing of the course would be determined by the latest performance"}

  - id: letter_grade_points
    type: attempt_semantics
    applies_to: all
    params: {points: {"A": 10, "A-": 9, "B": 8, "B-": 7, "C": 6, "C-": 5, "D": 4, "E": 2}}
    description: Letter grades and grade points (E = Exposed, 2 points, is a grade).
    source: {family: regulations, excerpt: "E Exposed 2"}

  - id: prerequisite_required
    type: eligibility
    applies_to: all
    params: {waivable_by: "Dean, AUGSD/AGSRD"}
    description: The prerequisite conditions of a course must be fulfilled before registering (or waived by the Dean).
    source: {family: regulations, excerpt: "Before a student can register in a course, he/she should have fulfilled the prerequisite conditions attached to that this course."}

  - id: prerequisite_waiver
    type: eligibility
    applies_to: all
    params: {approval: "Dean, AUGSD/AGSRD"}
    description: A prerequisite may be waived only with the consent of the Dean.
    source: {family: bulletin, excerpt: "Sometimes a particular course has a prerequisite condition which has to be fulfilled before one can register in that course, or has to be waived with the consent of the Dean"}

  - id: prerequisite_coverage_external
    type: coverage_limitation
    applies_to: all
    params: {authoritative_source: "https://academic.bits-pilani.ac.in/ (not supplied)"}
    description: The timetable defers the authoritative prerequisite/restriction list to an external portal that was not supplied.
    source: {family: timetable, excerpt: "PREREQUISITES/RESTRICTIONS FOR FIRST DEGREE AND HIGHER DEGREE COURSES Please see the details available at"}

  - id: prior_preparation_named_courses
    type: eligibility
    applies_to: first_degree
    params: {dca_may_examine_max_missing: 2}
    description: >-
      To register in a prescribed semester's named courses the student must have cleared all named courses of the
      preceding semesters; the DCA may examine cases with at most two uncleared courses.
    source: {family: regulations, excerpt: "All named courses in semesters and terms preceding this set of courses in his/her programme."}

  - id: prior_preparation_dca_exception
    type: approval
    applies_to: first_degree
    params: {max_missing: 2, approval: "DCA recommendation, Dean AUGS finalisation"}
    description: The DCA may examine a student who has not cleared at most two prior-preparation courses.
    source: {family: regulations, excerpt: "the DCA may examine the case of a student who has not cleared at most two courses out of the prior-preparation package"}

  - id: other_discipline_course_prior_prep
    type: eligibility
    applies_to: first_degree
    params: {own_programme_prior_prep_through: {year: "III", sem: 1}}
    description: >-
      A discipline (core or elective) course of a degree other than the student's own requires completion of the
      prior preparation of the third-year first semester of the student's own programme.
    source: {family: regulations, excerpt: "Must have completed the prior- preparation of the third year first semester of his/her own programme."}

  - id: higher_degree_course_prior_prep
    type: eligibility
    applies_to: first_degree
    params: {requires: "first set of own discipline core courses (second-year DC in the chart) cleared"}
    description: A higher-degree course of the student's own discipline requires clearing the first set of own discipline core courses.
    source: {family: regulations, excerpt: "After clearing first set of his/her own Discipline core courses in the case of single degree."}

  - id: higher_degree_course_limit
    type: plan_limit
    applies_to: first_degree
    params: {max_hd_courses_per_semester: 1, cgpa_threshold: null, cgpa_threshold_source: "prescribed by AGC (value not supplied)"}
    description: A first degree student above an AGC-prescribed CGPA may register in at most one higher degree course per semester.
    source: {family: regulations, excerpt: "Normally, a first degree student above a particular CGPA as prescribed by AGC will be allowed to register in maximum of one higher degree course per semester."}

  - id: higher_degree_course_counts_as_open
    type: allocation
    applies_to: first_degree
    params: {counts_as: OPEL, unless_in: DEL_pool}
    description: A higher degree course counts as an open elective unless it is listed in the student's discipline-elective pool.
    source: {family: regulations, excerpt: "This will be counted as an open elective unless the course is listed in the pool of discipline electives for his/her programme."}

  - id: hd_course_needs_cdc
    type: eligibility
    applies_to: first_degree
    params: {requires: "cleared or registered in the CDC of the respective discipline of the higher degree course"}
    description: A higher degree course taken as an elective requires having cleared or registered in the CDC of that discipline.
    source: {family: timetable, excerpt: "Students must have cleared or registered in the CDC of respective discipline of the higher degree course. Only one higher degree course can be taken as elective in a semester."}

  - id: extra_electives_limit
    type: plan_limit
    applies_to: first_degree
    params: {max_extra_electives: 4}
    description: Over and above the prescribed electives, at most four additional electives may be taken.
    source: {family: regulations, excerpt: "Over and above the prescribed number of electives, a student of an integrated first degree programme will be allowed to take, on his/her own option, upto a maximum number of four electives."}

  - id: elective_overflow_to_open
    type: allocation
    applies_to: first_degree
    params: {order: ["DEL", "HUEL", "OPEL"]}
    description: Any elective counts as an open elective once discipline and humanities elective requirements are met.
    source: {family: regulations, excerpt: "Normally any elective course will be treated as an Open Elective once the student's requirements under Discipline Electives and Humanities Electives have been accounted for."}

  - id: category_minimums
    type: requirement
    applies_to: first_degree
    params: {}
    description: The minimum number of courses and units in each category, and 42 courses / 144 units overall, must be met.
    source: {family: bulletin, excerpt: "A student should complete the minimum number of courses and units required in each category as well as meet the minimum requirements of courses (42) and units (144) in total."}

  - id: dual_degree_dc_shared
    type: allocation
    applies_to: dual_degree
    params: {shared_dc_counts_once: true}
    description: A course meeting the discipline requirements of both degrees of a dual degree need not be repeated.
    source: {family: bulletin, excerpt: "any course that meets the discipline requirements of both the degree programs need not be repeated"}

  - id: dual_degree_de_as_open
    type: allocation
    applies_to: dual_degree
    params: {de_of_one_degree_counts_as_opel_of_other: true}
    description: Discipline electives of either degree may fulfil the open elective requirement of the other.
    source: {family: bulletin, excerpt: "the Discipline Elective courses of either of the two degrees in a dual degree program may be used to fulfill the open elective requirement of the other degree"}

  - id: dual_degree_open_met_by_de
    type: allocation
    applies_to: dual_degree
    params: {open_elective_requirement: met_by_de_of_other_degree}
    description: The open elective requirement of dual degree students is met by counting discipline electives of one degree as open electives of the other.
    source: {family: regulations, excerpt: "Open elective requirement of Dual degree students is met by counting the Discipline electives of one degree as Open Electives of the other degree."}

  - id: humanities_own_discipline_excluded
    type: allocation
    applies_to: first_degree
    params: {}
    description: A course (or its equivalent) of the student's own discipline cannot count as a humanities elective.
    source: {family: bulletin, excerpt: "a student cannot count a course (or its equivalent) of his/her own discipline (s) as a humanities elective even if it is listed in this pool of humanities electives"}

  - id: project_course_limits
    type: allocation
    applies_to: first_degree
    params: {de_max: 3, study_max: 1, laboratory_max: 2, design_max: 2, special_max: 1, opel_max: 3, total_max: 5}
    description: At most 3 project courses may count as discipline electives (study <=1, lab <=2, design <=2, special <=1), 3 as open electives, 5 in total.
    source: {family: bulletin, excerpt: "A student may avail a maximum of 3 Project courses to meet the Discipline Electives Requirement"}

  - id: minor_overlap_limit
    type: allocation
    applies_to: minor
    params: {max_courses: 2, max_units: 6, mandatory_categories: ["GIR_NAMED", "DC"]}
    description: At most 2 courses (6 units) of a minor may be met by mandatory courses of the major(s) (GIR excluding humanities, or DC).
    source: {family: regulations, excerpt: "At most 2 courses (and at most 6 units) out of the above requirement (of 5 courses and 15 units) may be met by mandatory courses of the student's degree"}

  - id: minor_no_double_use
    type: allocation
    applies_to: minor
    params: {}
    description: No course may count for two minors, nor for two majors and a minor.
    source: {family: regulations, excerpt: "No course may be used to meet the requirements of two different minors nor may a course be used to the meet the requirements of two majors and a minor."}

  - id: minor_one_project
    type: allocation
    applies_to: minor
    params: {max_project_courses: 1}
    description: At most one project/seminar type course may count toward a minor's electives.
    source: {family: regulations, excerpt: "A student may use at most one project / seminar type course to meet the elective requirements of a minor."}

  - id: timetable_conflict_free
    type: plan_limit
    applies_to: all
    params: {}
    description: The final semester programme must be free of timetable conflicts.
    source: {family: regulations, excerpt: "The semester programme drawn up finally should be free from any Timetable conflict."}

  - id: compre_no_clash
    type: plan_limit
    applies_to: all
    params: {}
    description: Students must ensure comprehensive examination dates do not clash.
    source: {family: timetable, excerpt: "Comprehensive Examination Dates are not clashing."}

  - id: practice_school_exclusive
    type: plan_limit
    applies_to: first_degree
    params: {}
    description: No other course may be taken along with a Practice School component course.
    source: {family: regulations, excerpt: "There is no provision for taking other courses along with a Practice School component course."}

  - id: repeat_to_improve
    type: attempt_semantics
    applies_to: all
    params: {requires_part_of_current_prescribed_programme: true}
    description: A cleared course may be repeated to improve the grade if it is part of the current prescribed programme.
    source: {family: regulations, excerpt: "repeat, with a view to improving his/her grade, a course which He/she has already cleared, provided the course forms part of the current prescribed programme for the student."}

  - id: credit_hour_cohort
    type: eligibility
    applies_to: all
    params: {comcod_min: 5000, admission_years: [2026]}
    description: Offerings with computer code >= 5000 are only for 2026 admissions.
    source: {family: timetable, excerpt: "Courses with com cod >=5000 are meant only for 2026 admissions into FD, HD and PHD and not for others"}

  - id: no_institute_attendance_minimum
    type: policy_default
    applies_to: all
    params: {institute_minimum_attendance: null}
    description: The regulations do not stipulate a minimum attendance percentage for appearing in tests/examinations.
    source: {family: regulations, excerpt: "These regulations do not stipulate a minimum percentage of attendance before a student is permitted to appear in any test/examination."}

  - id: attendance_recorded
    type: policy_default
    applies_to: all
    params: {}
    description: Handout Part I (all courses) states that attendance will be recorded.
    source: {family: timetable, excerpt: "Attendance will be recorded."}

  - id: midsem_default
    type: policy_default
    applies_to: all
    params: {duration_min: 90, weight_range: [25, 35]}
    description: Handout Part I says a 90-minute mid-semester test (25-35%) is conducted for all courses; Part II gives course specifics.
    source: {family: timetable, excerpt: "A mid-semester test of 90 minutes"}

  - id: makeup_default
    type: policy_default
    applies_to: all
    params: {}
    description: Handout Part I - make-up for any component only in genuine cases of absence, with prior permission if anticipated.
    source: {family: timetable, excerpt: "Make-up for any component of evaluation will be given only in genuine cases of absence."}

  - id: minor_declaration
    type: approval
    applies_to: minor
    params: {declare_by: "end of 2nd year"}
    description: A student pursuing a minor must declare it at the end of the 2nd year.
    source: {family: regulations, excerpt: "should declare at the end of the 2nd year that he/she will pursue a specific minor"}
